# Self-hosted LangWatch stack.
# Vendored from the official langwatch/langwatch `compose.yml`, with two minimal
# tweaks for this template:
#   1. joins a shared external network `agent-net` (alias `langwatch`) so the
#      agent app (main docker-compose.yml) can send traces to it;
#   2. LangWatch's own Postgres/Redis are internal-only (no host ports) to avoid
#      clashing with the agent's Postgres on :5432.
#
# Run:   make langwatch-up      (creates the network, then `docker compose -f ... up -d`)
# UI:    http://localhost:5560  → create a project → copy API key → .env LANGWATCH_API_KEY
#
# ⚠️ This is LangWatch's stack, not ours. If a service needs more env, follow
#    their self-hosting docs and fill `langwatch/.env`.
services:
  app:
    image: langwatch/langwatch:latest
    environment:
      SKIP_ENV_VALIDATION: "true"
      DATABASE_URL: postgresql://prisma:prisma@postgres:5432/mydb?schema=mydb
      CLICKHOUSE_URL: http://default:langwatch@clickhouse:8123/langwatch
      REDIS_URL: redis://redis:6379
      LANGWATCH_NLP_SERVICE: http://langwatch_nlp:5561
      LANGEVALS_ENDPOINT: http://langevals:5562
      LANGWATCH_ENDPOINT: http://app:5560
      INSTALL_METHOD: docker
      NODE_ENV: production
    env_file:
      - langwatch/.env
    ports:
      - "5560:5560"
    networks:
      default: {}
      agent-net:
        aliases: [langwatch]   # agent app reaches it at http://langwatch:5560
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  workers:
    image: langwatch/langwatch:latest
    command: ["pnpm", "run", "start:workers"]
    working_dir: /app/langwatch
    environment:
      SKIP_ENV_VALIDATION: "true"
      DATABASE_URL: postgresql://prisma:prisma@postgres:5432/mydb?schema=mydb
      CLICKHOUSE_URL: http://default:langwatch@clickhouse:8123/langwatch
      REDIS_URL: redis://redis:6379
      LANGWATCH_NLP_SERVICE: http://langwatch_nlp:5561
      LANGEVALS_ENDPOINT: http://langevals:5562
      LANGWATCH_ENDPOINT: http://app:5560
      NODE_ENV: production
    env_file:
      - langwatch/.env
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  langwatch_nlp:
    image: langwatch/langwatch_nlp:latest
    env_file:
      - langwatch/.env
    ports:
      - "5561:5561"
    restart: always
    environment:
      - LANGWATCH_ENDPOINT=http://app:5560

  langevals:
    image: langwatch/langevals:latest
    ports:
      - "5562:5562"
    restart: always
    environment:
      - DISABLE_EVALUATORS_PRELOAD=true

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
    volumes:
      - lw-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    volumes:
      - lw-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: langwatch/clickhouse-serverless:0.2.0
    environment:
      CLICKHOUSE_PASSWORD: langwatch
    ports:
      - "8123:8123"
    volumes:
      - lw-clickhouse-data:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

networks:
  agent-net:
    external: true      # created by `make langwatch-up`; shared with the agent app

volumes:
  lw-db-data:
  lw-redis-data:
  lw-clickhouse-data:
