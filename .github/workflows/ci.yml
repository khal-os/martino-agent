# CI gate — mirrors `make check` (ruff + mypy --strict + offline tests).
# Offline only: no model keys, no network model calls. Real evals (make eval)
# cost tokens and run in a separate nightly/pre-release lane, not here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per branch/PR — new pushes cancel the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Honor the supported range in pyproject (requires-python >=3.11,<3.13).
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install deps (dev extras)
        run: uv venv && uv pip install -e ".[dev]"

      - name: Lint + types + offline tests
        run: make check
