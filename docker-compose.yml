# Local / self-host stack: the agent + Postgres (with pgvector for knowledge).
# `docker compose up --build` → agent on http://localhost:8888 (docs at /docs).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      default: {}
      agent-net: {}   # shared so the Omni stack can reuse this Postgres (make omni-up)

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      AGENT_ID: ${AGENT_ID:-assistant}
      AGENT_NAME: ${AGENT_NAME:-Assistant}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-anthropic}
      MODEL_ID: ${MODEL_ID:-claude-sonnet-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      DATABASE_URL: postgresql://agent:agent@db:5432/agent
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-0}
      API_KEY: ${API_KEY:-}
      API_WORKERS: ${API_WORKERS:-2}
      DEBUG: ${DEBUG:-0}
      # Omni webhook adapter (POST /omni/webhook). Route channel messages through
      # an A/B experiment (sticky per sender) by setting OMNI_EXPERIMENT.
      OMNI_AGENT_ID: ${OMNI_AGENT_ID:-}
      OMNI_EXPERIMENT: ${OMNI_EXPERIMENT:-}
      # Observability → self-hosted LangWatch (make langwatch-up). Reachable on
      # the shared agent-net at http://langwatch:5560. No-op until enabled.
      LANGWATCH_ENABLED: ${LANGWATCH_ENABLED:-0}
      LANGWATCH_ENDPOINT: ${LANGWATCH_ENDPOINT:-http://langwatch:5560}
      LANGWATCH_API_KEY: ${LANGWATCH_API_KEY:-}
    ports:
      - "8888:8888"
    networks:
      default: {}
      agent-net: {}   # shared with LangWatch; created by `make langwatch-up`

networks:
  agent-net:
    external: true

volumes:
  pgdata:
